<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xGhost Security Dashboard</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #00ff88; --text: #c9d1d9; --border: #30363d; }
        body { background: var(--bg); color: var(--text); font-family: monospace; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: var(--accent); text-align: center; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 20px; margin-bottom: 20px; }
        button { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        pre { background: #000; padding: 15px; border-radius: 4px; border: 1px solid var(--border); color: #00ff88; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>0xGhost Security Suite</h1>

        <div class="card">
            <h3>How to Start a New Scan:</h3>
            <p>1. Open the <strong>Actions</strong> tab in your GitHub Repository.</p>
            <p>2. Click <strong>0xGhost Automated Scanner Pipeline</strong>.</p>
            <p>3. Click <strong>Run workflow</strong>, enter your target, and run it.</p>
            <p>4. Once finished, click the button below to load the scan report.</p>
            <button onclick="fetchResults()">Fetch Latest Results</button>
        </div>

        <div class="card" id="reportCard" style="display:none;">
            <h2>Master Scan Report</h2>
            <div id="output"></div>
        </div>
    </div>

    <script>
        async function fetchResults() {
            const out = document.getElementById('output');
            document.getElementById('reportCard').style.display = 'block';
            out.innerHTML = 'Fetching results...';

            try {
                const res = await fetch('./results.json?cb=' + new Date().getTime());
                if (!res.ok) {
                    out.innerHTML = '<p style="color: #ff5555;">No scan results found yet. Run a workflow first!</p>';
                    return;
                }
                const data = await res.json();
                out.innerHTML = `
                    <p><strong>Target:</strong> ${data.target || 'N/A'}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (e) {
                out.innerHTML = '<p style="color: #ff5555;">Error loading results.json file.</p>';
            }
        }
        window.onload = fetchResults;
    </script>
</body>
</html>
