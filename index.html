<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xGhost Security Dashboard</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #00ff88; --text: #c9d1d9; --border: #30363d; }
        body { background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { color: var(--accent); text-align: center; margin-bottom: 10px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        button { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        input[type="text"] { width: 60%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #0b0f13; color: var(--text); }
        .small { font-size: 0.9rem; color: #9aa3ad; }
        pre { background: #000; padding: 15px; border-radius: 6px; border: 1px solid var(--border); color: #00ff88; overflow-x: auto; }
        .row { display:flex; gap: 12px; align-items:center; margin-bottom: 12px; }
        .section-title { color: #9be6b4; margin-top: 8px; margin-bottom: 6px; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.03); text-align: left; font-family: monospace; }
        .muted { color: #7a869a; font-size: 0.9rem }
    </style>
</head>
<body>
    <div class="container">
        <h1>0xGhost Security Suite</h1>

        <div class="card">
            <h3>Start a New Scan</h3>
            <div class="row">
                <input type="text" id="targetInput" placeholder="e.g. example.com or 1.2.3.4" />
                <button id="startBtn" onclick="startScan()">Start Scan</button>
            </div>
            <div class="small">Enter the target and click Start — scans run inside the container and results will appear below when finished.</div>
            <div id="jobInfo" class="small" style="margin-top:10px;"></div>
        </div>

        <div class="card" id="reportCard" style="display:none;">
            <h2>Scan Report</h2>
            <div id="summary"></div>
            <div id="details"></div>
        </div>
    </div>

    <script>
        let pollingHandle = null;

        async function startScan() {
            const target = document.getElementById('targetInput').value.trim();
            if (!target) { alert('Please enter a target.'); return; }
            document.getElementById('jobInfo').innerText = 'Starting scan...';
            document.getElementById('reportCard').style.display = 'none';

            try {
                const res = await fetch('/api/scan', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({target})
                });
                if (!res.ok) {
                    const err = await res.json();
                    document.getElementById('jobInfo').innerText = 'Error: ' + (err.error || res.statusText);
                    return;
                }
                const data = await res.json();
                const jobId = data.job_id;
                document.getElementById('jobInfo').innerText = `Scan started (job ${jobId}). Polling status...`;
                pollStatus(jobId);
            } catch (e) {
                document.getElementById('jobInfo').innerText = 'Error starting scan.';
            }
        }

        function pollStatus(jobId) {
            if (pollingHandle) clearInterval(pollingHandle);
            pollingHandle = setInterval(async () => {
                try {
                    const res = await fetch(`/api/status/${jobId}`);
                    if (!res.ok) { document.getElementById('jobInfo').innerText = 'Failed to fetch job status.'; clearInterval(pollingHandle); return; }
                    const s = await res.json();
                    document.getElementById('jobInfo').innerText = `Job ${jobId} status: ${s.status}`;
                    if (s.status === 'done') {
                        clearInterval(pollingHandle);
                        fetchResult(jobId);
                    } else if (s.status === 'error') {
                        clearInterval(pollingHandle);
                        document.getElementById('jobInfo').innerText = `Job ${jobId} errored.`;
                    }
                } catch (e) {
                    document.getElementById('jobInfo').innerText = 'Error polling status.';
                    clearInterval(pollingHandle);
                }
            }, 3000);
        }

        async function fetchResult(jobId) {
            document.getElementById('jobInfo').innerText = `Fetching result for job ${jobId}...`;
            try {
                const res = await fetch(`/api/result/${jobId}`);
                if (res.status === 202) { document.getElementById('jobInfo').innerText = 'Result not ready yet.'; return; }
                if (!res.ok) { const err = await res.json(); document.getElementById('jobInfo').innerText = 'Error: ' + (err.error || res.statusText); return; }
                const report = await res.json();
                renderReport(report);
                document.getElementById('jobInfo').innerText = 'Scan complete.';
            } catch (e) {
                document.getElementById('jobInfo').innerText = 'Error fetching result.';
            }
        }

        function renderReport(report) {
            document.getElementById('reportCard').style.display = 'block';
            const summaryDiv = document.getElementById('summary');
            const detailsDiv = document.getElementById('details');
            summaryDiv.innerHTML = `<p><strong>Target:</strong> ${report.target || 'N/A'}</p>`;

            const scans = report.scans || {};
            let summaryTable = '<div class="section-title">Scans Overview</div><table><thead><tr><th>Phase</th><th>Note</th></tr></thead><tbody>';
            for (const [phase, data] of Object.entries(scans)) {
                const note = (data && data.total_subdomains) ? `subdomains=${data.total_subdomains}` : (data && data.results ? `items=${data.results.length}` : '—');
                summaryTable += `<tr><td>${phase}</td><td>${note}</td></tr>`;
            }
            summaryTable += '</tbody></table>';

            detailsDiv.innerHTML = `<div class="section-title">Detailed JSON</div><pre>${JSON.stringify(report, null, 2)}</pre>`;
            summaryDiv.innerHTML += summaryTable;
        }
    </script>
</body>
</html>
