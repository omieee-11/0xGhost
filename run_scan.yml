name: Run SPECTRE Backend Scan

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Domain'
        required: true
        default: 'example.com'

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap

      - name: Execute main.py
        run: |
          python main.py "${{ github.event.inputs.target }}"

      - name: Save & Push Results JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results_*.json
          git commit -m "Add scan results for ${{ github.event.inputs.target }}" || exit 0
          git push
