<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>0xGhost // Security Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'JetBrains Mono', monospace; background:#050101; color:#fecdd3; }
    .panel { background:#0a0202; border:1px solid rgba(239,68,68,.35); }
    pre { white-space:pre-wrap; word-break:break-word; }
  </style>
</head>
<body class="min-h-screen">
  <header class="border-b border-red-600/40 bg-black/40 px-4 py-4">
    <div class="mx-auto flex max-w-7xl items-center justify-between">
      <h1 class="text-xl font-bold text-red-500">&gt; 0xGHOST <span class="text-xs text-red-300">SECURITY DASHBOARD</span></h1>
      <span id="server-status" class="text-xs text-amber-400">CHECKING SERVER...</span>
    </div>
  </header>

  <main class="mx-auto grid max-w-7xl gap-6 p-4 lg:grid-cols-3">
    <section class="panel rounded-lg p-5 lg:col-span-1">
      <h2 class="mb-4 text-sm font-bold text-red-400">// TARGET CONFIGURATION</h2>
      <form id="scan-form" class="space-y-4">
        <label class="block text-xs uppercase text-red-300">Target domain / IP
          <input id="target-input" required autocomplete="off" placeholder="example.com"
            class="mt-2 w-full rounded border border-red-700/60 bg-black px-3 py-3 text-sm text-red-100 outline-none focus:border-red-400">
        </label>
        <label class="block text-xs uppercase text-red-300">Profile
          <select id="scan-profile" class="mt-2 w-full rounded border border-red-700/60 bg-black px-3 py-3 text-sm text-red-100">
            <option value="FULL_ATTACK_PIPELINE">Full pipeline</option>
            <option value="AGGRESSIVE_RECON">Aggressive reconnaissance</option>
            <option value="DEEP_EXPLOIT_AUDIT">Deep vulnerability audit</option>
            <option value="WEB_BRUTE">Web content discovery</option>
          </select>
        </label>
        <div class="flex gap-2">
          <button id="start-btn" class="flex-1 rounded border border-red-600 bg-red-950 px-4 py-3 text-sm font-bold text-red-100 hover:bg-red-900">START SCAN</button>
          <button id="abort-btn" type="button" disabled class="rounded border border-zinc-700 px-4 py-3 text-sm text-zinc-400 disabled:opacity-40">ABORT</button>
        </div>
      </form>
      <div id="phase-list" class="mt-6 space-y-2 text-xs"></div>
    </section>

    <section class="space-y-6 lg:col-span-2">
      <div class="panel rounded-lg p-5">
        <div class="mb-2 flex justify-between text-xs text-red-400"><span>// LIVE STATUS</span><span id="job-id">JOB_ID: NONE</span></div>
        <div id="terminal" class="h-56 overflow-y-auto rounded border border-red-950 bg-black p-3 text-xs text-red-300"></div>
      </div>
      <div class="panel rounded-lg p-5">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-2 border-b border-red-950 pb-3">
          <div class="flex gap-2"><button data-tab="summary" class="tab rounded bg-red-950 px-3 py-2 text-xs text-red-100">SUMMARY</button><button data-tab="json" class="tab rounded px-3 py-2 text-xs text-red-400">RAW JSON</button></div>
          <div class="flex gap-2"><button id="copy-btn" disabled class="rounded border border-red-700 px-3 py-2 text-xs disabled:opacity-40">COPY</button><button id="export-btn" disabled class="rounded border border-red-700 px-3 py-2 text-xs disabled:opacity-40">DOWNLOAD</button></div>
        </div>
        <div id="summary" class="text-xs text-red-200">No report available. Start an authorized scan to populate the dashboard.</div>
        <pre id="json" class="hidden h-96 overflow-auto rounded bg-black p-3 text-xs text-red-300">{}</pre>
      </div>
    </section>
  </main>

  <script>
    const phases = ['OSINT.PY', 'NET.py', 'VULN.py', 'SECURITY.py', 'LAST.py'];
    const state = { jobId: null, report: null, timer: null };
    const $ = id => document.getElementById(id);
    const log = (message, type='info') => { const line=document.createElement('div'); line.textContent=`[${new Date().toLocaleTimeString()}] ${message}`; line.className=type==='error'?'text-rose-400':type==='success'?'text-green-300':'text-red-300'; $('terminal').appendChild(line); $('terminal').scrollTop=$('terminal').scrollHeight; };
    const setPhaseState = (index, status) => { const el=document.querySelector(`[data-phase="${index}"]`); if (el) { el.querySelector('span:last-child').textContent=status; el.querySelector('span:last-child').className=status==='RUNNING'?'text-amber-300':'text-red-300'; } };
    $('phase-list').innerHTML = phases.map((name,i)=>`<div data-phase="${i}" class="flex justify-between rounded border border-red-950 bg-black/40 p-2"><span>[P${i+1}] ${name}</span><span class="text-zinc-500">IDLE</span></div>`).join('');

    async function requestJSON(url, options={}) { const response=await fetch(url, options); const data=await response.json().catch(()=>({error:'Invalid server response'})); if(!response.ok && response.status!==202) throw new Error(data.error || `HTTP ${response.status}`); return data; }
    async function checkServer() { try { await requestJSON('/api/health'); $('server-status').textContent='SERVER ONLINE'; $('server-status').className='text-xs text-green-400'; } catch(e) { $('server-status').textContent='SERVER UNAVAILABLE'; $('server-status').className='text-xs text-rose-400'; } }
    async function pollJob() {
      if (!state.jobId) return;
      try {
        const status=await requestJSON(`/api/status/${state.jobId}`); log(`Job status: ${status.status}`);
        if(status.status==='running') phases.forEach((_,i)=>setPhaseState(i, 'RUNNING'));
        if(status.status==='done') { clearInterval(state.timer); phases.forEach((_,i)=>setPhaseState(i, 'COMPLETED')); state.report=await requestJSON(`/api/result/${state.jobId}`); renderReport(); finishUI('Scan completed', 'success'); }
        if(status.status==='error') { clearInterval(state.timer); finishUI(status.error || 'Scan failed', 'error'); }
      } catch(e) { log(e.message, 'error'); }
    }
    function finishUI(message,type) { $('start-btn').disabled=false; $('abort-btn').disabled=true; log(message,type); }
    function renderReport() { const text=JSON.stringify(state.report,null,2); $('json').textContent=text; $('copy-btn').disabled=false; $('export-btn').disabled=false; const runs=state.report.run_log||[]; $('summary').innerHTML=`<div class="grid gap-3 sm:grid-cols-3"><div class="rounded border border-red-950 p-3"><b>Target</b><br>${escapeHTML(state.report.target||'')}</div><div class="rounded border border-red-950 p-3"><b>Missing tools</b><br>${state.report.missing_tools?.length||0}</div><div class="rounded border border-red-950 p-3"><b>Phases</b><br>${runs.length}</div></div><div class="mt-4 overflow-auto"><table class="w-full text-left"><thead><tr class="border-b border-red-950"><th class="p-2">Phase</th><th class="p-2">Status</th><th class="p-2">Details</th></tr></thead><tbody>${runs.map(r=>`<tr class="border-b border-red-950/50"><td class="p-2">${escapeHTML(r.script||'')}</td><td class="p-2">${r.skipped?'SKIPPED':r.rc===0?'OK':'WARN'}</td><td class="p-2">${escapeHTML((r.stderr||'').slice(0,240))}</td></tr>`).join('')}</tbody></table></div>`; }
    const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

    $('scan-form').addEventListener('submit', async event => { event.preventDefault(); const target=$('target-input').value.trim(); if(!target) return; $('start-btn').disabled=true; $('abort-btn').disabled=false; $('terminal').innerHTML=''; $('summary').textContent='Scan queued...'; phases.forEach((_,i)=>setPhaseState(i,'QUEUED')); log(`Submitting authorized scan for ${target}`); try { const data=await requestJSON('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target,profile:$('scan-profile').value})}); state.jobId=data.job_id; $('job-id').textContent=`JOB_ID: ${state.jobId}`; log(`Job accepted: ${state.jobId}`,'success'); state.timer=setInterval(pollJob,3000); await pollJob(); } catch(e) { finishUI(e.message,'error'); } });
    $('abort-btn').addEventListener('click', async()=>{ if(!state.jobId) return; try { await requestJSON(`/api/scan/${state.jobId}`,{method:'DELETE'}); clearInterval(state.timer); finishUI('Scan aborted by operator','error'); } catch(e) { log(e.message,'error'); } });
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{ document.querySelectorAll('.tab').forEach(b=>b.classList.remove('bg-red-950','text-red-100')); button.classList.add('bg-red-950','text-red-100'); $('summary').classList.toggle('hidden',button.dataset.tab!=='summary'); $('json').classList.toggle('hidden',button.dataset.tab!=='json'); }));
    $('copy-btn').addEventListener('click',()=>navigator.clipboard.writeText($('json').textContent)); $('export-btn').addEventListener('click',()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([$('json').textContent],{type:'application/json'})); a.download=`0xghost-report-${Date.now()}.json`; a.click(); });
    checkServer();
  </script>
</body>
</html>
